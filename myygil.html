<!doctype html><html lang="et"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tark Kinnisvara — müügil</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--bg:#f4efe8;--ink:#1c1917;--mut:#78716c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif}
h1,h3{font-family:Fraunces,Georgia,serif;font-weight:400;letter-spacing:-.02em;margin:0}
nav{position:fixed;top:0;left:0;right:0;z-index:1000;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 28px;background:rgba(244,239,232,.9);backdrop-filter:blur(10px);border-bottom:1px solid #0001}
nav .brand{font-family:Fraunces,serif;font-size:20px;font-weight:600;color:var(--ink);text-decoration:none}nav .links{display:flex;gap:24px}nav .links a{color:var(--ink);text-decoration:none;font-size:14px;font-weight:500;opacity:.75}nav .links a:hover,nav .links a.cur{opacity:1}nav .right{display:flex;align-items:center;gap:14px}
.lang button{background:none;border:0;color:var(--ink);font:600 13px Inter;opacity:.55;cursor:pointer;padding:2px 4px}.lang button.on{opacity:1;text-decoration:underline}
.cta{background:var(--ink);color:#fff;text-decoration:none;padding:9px 18px;border-radius:999px;font-size:14px;font-weight:600}
main{max-width:1180px;margin:0 auto;padding:110px 6vw 60px}h1{font-size:clamp(34px,5vw,60px);line-height:1.05}.lead{color:#57534e;max-width:700px;margin:12px 0 32px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px}
.card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 1px 0 #0001;display:flex;flex-direction:column}
.ph{aspect-ratio:4/3;background:linear-gradient(160deg,#e9dfcf,#cfd9c8);display:grid;place-items:center;position:relative}.ph svg{width:46%;opacity:.55}
.badge{position:absolute;left:14px;top:14px;background:#16a34a;color:#fff;font-size:12px;font-weight:600;padding:4px 12px;border-radius:999px;letter-spacing:.03em}
.bd{padding:20px 22px 22px;display:grid;gap:6px;flex:1}.bd h3{font-size:26px}.dist{color:var(--mut);font-size:14px}.facts{display:flex;gap:16px;font-weight:500;margin:6px 0 12px}
.btns{display:grid;gap:8px;margin-top:auto}.btns a{display:block;text-align:center;padding:11px 14px;border-radius:999px;font-weight:600;font-size:14px;text-decoration:none;background:var(--ink);color:#fff}.btns a.bk{background:#f59e0b;color:var(--ink)}
.note{margin-top:34px;font-size:13px;color:var(--mut);max-width:720px}footer{padding:30px 6vw;color:var(--mut);font-size:13px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}footer a{color:var(--mut)}
@media(max-width:860px){nav .links{display:none}}@media(max-width:560px){nav{padding:10px 16px}.cta{padding:8px 14px}}
</style></head><body>

<script>
const CAL="https://calendly.com/d/cvkh-3gd-q4p/tark-kinnisvara-korteritega-tutvumine";
const OBJ=[{"a": "Gonsiori tn 3", "d": "Kesklinna", "r": 3, "m": 79, "kv": 3940837}, {"a": "Liivamäe tn 3", "d": "Kesklinna", "r": 3, "m": 66, "kv": 3932537}, {"a": "Kuldnoka tee 10, Türisalu", "d": "Türisalu küla", "r": 3, "m": 82, "kv": 3943296}, {"a": "Võru tn 16", "d": "Lasnamäe", "r": 4, "m": 80, "kv": 3940761}, {"a": "Mustamäe tee 141", "d": "Mustamäe", "r": 2, "m": 43, "kv": 3944458}, {"a": "Lastekodu tn 10", "d": "Kesklinna", "r": 3, "m": 53, "kv": 3946158}];
const TX={et:{nm1:"Meist",nm2:"Teenused",nm3:"Ostame",nm4:"Kaart",nm6:"Kontakt",nm7:"Müügil",cta:"Võta ühendust",h:"Müügil olevad korterid",p:"Valminud ja kolimisvalmis kodud Tallinnas ja selle lähiümbruses.",room:"tuba",kv:"Vaata kuulutust KV.EE-s",book:"Broneeri vaatamine",badge:"Müügil",note:"Hind ja täpsem info on KV.EE kuulutusel. Vaatamise aja saad valida otse meie kalendrist.",back:"← Avalehele"},
ru:{nm1:"О нас",nm2:"Услуги",nm3:"Выкупаем",nm4:"Карта",nm6:"Контакты",nm7:"В продаже",cta:"Связаться",h:"Квартиры в продаже",p:"Готовые, полностью обновлённые квартиры в Таллине и окрестностях.",room:"комн.",kv:"Объявление на KV.EE",book:"Записаться на просмотр",badge:"В продаже",note:"Цена и подробности — в объявлении на KV.EE. Время просмотра можно выбрать прямо в нашем календаре.",back:"← На главную"},
en:{nm1:"About",nm2:"Services",nm3:"We buy",nm4:"Map",nm6:"Contact",nm7:"For sale",cta:"Contact us",h:"Flats for sale",p:"Finished, move-in-ready homes in Tallinn and nearby.",room:"rooms",kv:"View listing on KV.EE",book:"Book a viewing",badge:"For sale",note:"Price and full details are in the KV.EE listing. You can pick a viewing time directly in our calendar.",back:"← Home"}};
let LANG='et';try{LANG=localStorage.getItem('lang')||''}catch(e){}if(!TX[LANG])LANG=(navigator.language||'et').slice(0,2);if(!TX[LANG])LANG='en';
const HOUSE='<svg viewBox="0 0 64 64" fill="none" stroke="#1c1917" stroke-width="2.5" stroke-linejoin="round"><path d="M8 30 32 10l24 20v24H8z"/><path d="M26 54V38h12v16"/></svg>';
function render(){const T=TX[LANG];document.getElementById('g').innerHTML=OBJ.map(o=>`<article class="card"><div class="ph">${HOUSE}<span class="badge">${T.badge}</span></div><div class="bd"><h3>${o.a.replace(/, Türisalu/,'')}</h3><div class="dist">${o.d}</div><div class="facts"><span>${o.r} ${T.room}</span><span>${o.m} m²</span></div><div class="btns"><a href="https://www.kv.ee/${o.kv}" target="_blank" rel="noopener">${T.kv}</a><a class="bk" href="${CAL}" target="_blank" rel="noopener">${T.book}</a></div></div></article>`).join('')}
function setLang(l){LANG=l;try{localStorage.setItem('lang',l)}catch(e){}document.documentElement.lang=l;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=TX[l][e.dataset.t]);document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));render()}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));setLang(LANG);
</script></body></html>
